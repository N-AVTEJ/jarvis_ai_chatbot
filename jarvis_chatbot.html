<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS AI Assistant</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>J.A.R.V.I.S</h1>
            <p>Just A Rather Very Intelligent System</p>
        </div>
        
        <div class="chat-container" id="chatContainer">
            <div class="welcome-message">
                <h2>Welcome to JARVIS</h2>
                <p>Your intelligent AI assistant is ready to help. You can type messages, upload images, or use voice input.</p>
            </div>
        </div>
        
        <div class="typing-indicator" id="typingIndicator">
            <div class="message-content">
                <div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
        
        <div class="input-container">
            <div class="input-wrapper">
                <input type="text" class="message-input" id="messageInput" placeholder="Ask JARVIS anything..." autocomplete="off">
                <div class="control-buttons">
                    <button class="control-btn" id="imageBtn" title="Upload Image">
                        📷
                    </button>
                    <button class="control-btn" id="voiceBtn" title="Voice Input">
                        🎤
                    </button>
                    <button class="control-btn" id="sendBtn" title="Send Message">
                        ➤
                    </button>
                </div>
                <input type="file" class="file-input" id="fileInput" accept="image/*">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
